[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-bio-system"
version = "0.1.0"
description = "Routing, evidence selection, verification, and critique runtime for AURA-Bio"
requires-python = ">=3.11"
dependencies = [
  "aura-bio-processing",
  "numpy>=1.26,<3",
  "sympy>=1.12,<2",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3,<6"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27"]

[project.scripts]
aura-bio = "aura_bio.cli:main"
aura-bio-api = "aura_bio.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
