[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-bio-system"
version = "0.1.0"
description = "Routing, evidence selection, verification, and critique runtime for AURA-Bio"
requires-python = ">=3.11"
dependencies = [
  "aura-bio-processing",
  "numpy>=1.26,<3",
  "sympy>=1.12,<2",
  "pint>=0.24,<1",
  "biopython>=1.85,<2",
  "periodictable>=2,<3",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3,<6"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27", "python-multipart>=0.0.18,<1"]
study = ["python-pptx>=1.0,<2", "openpyxl>=3.1,<4", "python-multipart>=0.0.18,<1", "defusedxml>=0.7,<1", "pdfplumber>=0.11,<1"]
visual = ["Pillow>=11,<13", "pypdfium2>=4,<6", "pypdf>=6,<7"]

[project.scripts]
aura-bio = "aura_bio.cli:main"
aura-bio-api = "aura_bio.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
