<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">AURA-Bio evidence-grounded answer pipeline</title>
  <desc id="desc">A learner question flows through routing, hybrid retrieval, grounded generation and verification to a cited answer. Corpus provenance and end-to-end tracing support the whole process.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071a2a"/><stop offset="1" stop-color="#122f3e"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#67e8f9"/></marker>
    <style>
      .label{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.small{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.eyebrow{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.7px;fill:#67e8f9}.node{fill:#102b3b;stroke:#31566b;stroke-width:1.4}.side{fill:#0c2230;stroke:#274b5d;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1200" height="590" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" class="eyebrow">AURA-BIO • LOCAL-FIRST, EVIDENCE-GROUNDED</text>
  <text x="60" y="108" class="label" style="font-size:30px">Trust is built around the model</text>
  <text x="60" y="136" class="small">Each answer is routed, evidenced, checked, and made inspectable.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="220" width="170" height="115" rx="16" class="node"/><text x="85" y="262" class="label">Learner question</text><text x="85" y="289" class="small">level · intent · depth</text>
    <rect x="285" y="220" width="170" height="115" rx="16" class="node"/><text x="311" y="262" class="label">Route</text><text x="311" y="289" class="small">task &amp; teaching mode</text>
    <rect x="510" y="220" width="190" height="115" rx="16" class="node"/><text x="536" y="262" class="label">Retrieve</text><text x="536" y="289" class="small">BM25 · dense · rerank</text>
    <rect x="755" y="220" width="170" height="115" rx="16" class="node"/><text x="781" y="262" class="label">Generate</text><text x="781" y="289" class="small">local model or extractive</text>
    <rect x="980" y="220" width="160" height="115" rx="16" class="node"/><text x="1006" y="262" class="label">Verify</text><text x="1006" y="289" class="small">claims · order · maths</text>
  </g>
  <g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M232 278H279"/><path d="M457 278H504"/><path d="M702 278H749"/><path d="M927 278H974"/></g>
  <g filter="url(#shadow)"><rect x="60" y="412" width="510" height="112" rx="16" class="side"/><rect x="630" y="412" width="510" height="112" rx="16" class="side"/></g>
  <circle cx="96" cy="452" r="12" fill="url(#accent)"/><text x="122" y="457" class="label">Provenance-first corpus</text><text x="122" y="484" class="small">Licensed sources · hashes · manifests · citation passages</text>
  <circle cx="666" cy="452" r="12" fill="url(#accent)"/><text x="692" y="457" class="label">End-to-end trace</text><text x="692" y="484" class="small">Inputs, stage decisions, latency, evidence, and final answer</text>
  <path d="M605 337V381H315V406" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 7" fill="none" marker-end="url(#arrow)"/><path d="M1060 337V381H885V406" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 7" fill="none" marker-end="url(#arrow)"/>
</svg>
